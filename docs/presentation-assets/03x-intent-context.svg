<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><style>@import url("https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap"); text { font-family: 'Noto Sans JP','Noto Sans SC','Hiragino Sans','Yu Gothic',sans-serif; }</style><rect width="1920" height="1080" fill="#ffffff"/><text x="80" y="92" font-size="40" font-weight="700" fill="#15191e" text-anchor="start">「大丈夫です」— 同じ言葉でも、文脈で意味が変わる</text><text x="80" y="140" font-size="22" font-weight="400" fill="#4a535e" text-anchor="start">患者の「大丈夫です。」を英語の医師に。A は文脈を見ない通常の翻訳、Kumu は直前の会話から意図を解析する（本物の Gemini）</text><text x="400" y="205" font-size="20" font-weight="700" fill="#6b747f" text-anchor="start">直前の医師の発言</text><text x="980" y="205" font-size="20" font-weight="700" fill="#6b747f" text-anchor="start">A 通常の翻訳</text><text x="1380" y="205" font-size="20" font-weight="700" fill="#0b5c80" text-anchor="start">Kumu</text><rect x="80" y="230" width="1760" height="150" rx="18" fill="#fff" stroke="#d5dae0" stroke-width="2"/><text x="110" y="315" font-size="30" font-weight="700" fill="#15191e" text-anchor="start">大丈夫です。</text><text x="400" y="300" font-size="24" font-weight="500" fill="#15191e" text-anchor="start">立ち上がるのを手伝いましょうか？</text><text x="400" y="340" font-size="20" font-weight="500" fill="#4a535e" text-anchor="start">→ 意図: 断る</text><text x="980" y="315" font-size="26" font-weight="500" fill="#4a535e" text-anchor="start">I am fine.</text><text x="1380" y="315" font-size="26" font-weight="700" fill="#0b5c80" text-anchor="start">No, thank you. I am fine.</text><rect x="80" y="400" width="1760" height="150" rx="18" fill="#fff" stroke="#d5dae0" stroke-width="2"/><text x="110" y="485" font-size="30" font-weight="700" fill="#15191e" text-anchor="start">大丈夫です。</text><text x="400" y="470" font-size="24" font-weight="500" fill="#15191e" text-anchor="start">お待たせしてすみません。</text><text x="400" y="510" font-size="20" font-weight="500" fill="#4a535e" text-anchor="start">→ 意図: 気にしないで</text><text x="980" y="485" font-size="26" font-weight="500" fill="#4a535e" text-anchor="start">I am okay.</text><text x="1380" y="485" font-size="26" font-weight="700" fill="#0b5c80" text-anchor="start">That&#x27;s quite alright.</text><rect x="80" y="570" width="1760" height="150" rx="18" fill="#fff" stroke="#d5dae0" stroke-width="2"/><text x="110" y="655" font-size="30" font-weight="700" fill="#15191e" text-anchor="start">大丈夫です。</text><text x="400" y="640" font-size="24" font-weight="500" fill="#15191e" text-anchor="start">このまま診察を続けてもいいですか？</text><text x="400" y="680" font-size="20" font-weight="500" fill="#4a535e" text-anchor="start">→ 意図: 同意</text><text x="980" y="655" font-size="26" font-weight="500" fill="#4a535e" text-anchor="start">I am okay.</text><text x="1380" y="655" font-size="26" font-weight="700" fill="#0b5c80" text-anchor="start">That&#x27;s fine.</text><rect x="80" y="740" width="1760" height="150" rx="18" fill="#fff6db" stroke="#e9cf7a" stroke-width="2"/><text x="110" y="825" font-size="30" font-weight="700" fill="#15191e" text-anchor="start">大丈夫です。</text><text x="400" y="810" font-size="24" font-weight="500" fill="#15191e" text-anchor="start">痛み止めの注射をしましょうか？</text><text x="400" y="850" font-size="20" font-weight="500" fill="#4a535e" text-anchor="start">→ 意図: 決まらない</text><text x="980" y="825" font-size="26" font-weight="500" fill="#4a535e" text-anchor="start">I am okay.</text><text x="1380" y="810" font-size="26" font-weight="700" fill="#5c4300" text-anchor="start">訳さずに本人に確認</text><text x="1380" y="850" font-size="20" font-weight="500" fill="#5c4300" text-anchor="start">「断る／お願いする」を本人が選ぶ</text><text x="80" y="935" font-size="21" font-weight="500" fill="#15191e" text-anchor="start">25 件の評価: 本人に聞くべき 8 件で、未確認のまま送った A 8 件 → Kumu 0 件。文脈で決まる 17 件で不要に聞いた 0 件</text><text x="80" y="975" font-size="18" font-weight="400" fill="#6b747f" text-anchor="start">実行: 2026-11-10 05:23 JST、gemini-3.8-flash・global。症例は架空、正解は開発チームが事前に決めた</text></svg>