<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><style>@import url("https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap"); text { font-family: 'Noto Sans JP','Noto Sans SC','Hiragino Sans','Yu Gothic',sans-serif; }</style><rect width="1920" height="1080" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b747f"/></marker></defs><text x="80" y="92" font-size="40" font-weight="700" fill="#15191e" text-anchor="start">Kumu の仕組み — 訳す前に意味を確かめ、確かめてから届ける</text><text x="80" y="140" font-size="22" font-weight="400" fill="#4a535e" text-anchor="start">Unified Semantic Safety Architecture（USSA）。発言ごとに次の順で処理する（医師→患者・患者→医師で同じ）</text><rect x="80" y="200" width="300" height="250" rx="18" fill="#f6f7f9" stroke="#d5dae0" stroke-width="2"/><text x="105" y="245" font-size="28" font-weight="700" fill="#15191e" text-anchor="start">患者・医師</text><text x="105" y="290.0" font-size="20" font-weight="400" fill="#4a535e" text-anchor="start">患者: スマホ（中国語など）</text><text x="105" y="319.0" font-size="20" font-weight="400" fill="#4a535e" text-anchor="start">医師: PC（日本語）</text><text x="105" y="370" font-size="22" font-weight="700" fill="#0b5c80" text-anchor="start">Speech &amp; Input</text><text x="105" y="405.0" font-size="19" font-weight="400" fill="#4a535e" text-anchor="start">音声は文字になるだけ</text><text x="105" y="432.55" font-size="19" font-weight="400" fill="#4a535e" text-anchor="start">直して自分で「送る」</text><line x1="385" y1="325" x2="445" y2="325" stroke="#6b747f" stroke-width="3" marker-end="url(#ah)"/><rect x="450" y="200" width="380" height="115" rx="18" fill="#fff" stroke="#d5dae0" stroke-width="2"/><text x="475" y="245" font-size="26" font-weight="700" fill="#15191e" text-anchor="start">Source Agent</text><rect x="706" y="222" width="118.89999999999999" height="31" rx="15.5" fill="#f1eafa" stroke="#f1eafa" stroke-width="2"/><text x="765.45" y="242" font-size="17" font-weight="700" fill="#6b3fa0" text-anchor="middle">Gemini</text><text x="475" y="285.0" font-size="19" font-weight="400" fill="#4a535e" text-anchor="start">発話意図・意味の枠を解析</text><rect x="450" y="335" width="380" height="115" rx="18" fill="#fff" stroke="#d5dae0" stroke-width="2"/><text x="475" y="380" font-size="26" font-weight="700" fill="#15191e" text-anchor="start">Translation Agent</text><rect x="706" y="359" width="118.89999999999999" height="31" rx="15.5" fill="#f1eafa" stroke="#f1eafa" stroke-width="2"/><text x="765.45" y="379" font-size="17" font-weight="700" fill="#6b3fa0" text-anchor="middle">Gemini</text><text x="475" y="420.0" font-size="19" font-weight="400" fill="#4a535e" text-anchor="start">原文から直接訳す（下書き）</text><text x="625" y="488" font-size="18" font-weight="500" fill="#6b747f" text-anchor="end">並列に実行</text><line x1="835" y1="325" x2="895" y2="325" stroke="#6b747f" stroke-width="3" marker-end="url(#ah)"/><rect x="900" y="200" width="330" height="250" rx="18" fill="#e6f1f6" stroke="#0b5c80" stroke-width="2"/><text x="925" y="245" font-size="26" font-weight="700" fill="#0b5c80" text-anchor="start">Semantic Bridge</text><text x="925" y="290.0" font-size="19" font-weight="400" fill="#15191e" text-anchor="start">言語に依存しない意味の枠</text><text x="925" y="317.55" font-size="19" font-weight="400" fill="#15191e" text-anchor="start">否定・数量・日時・条件・</text><text x="925" y="345.1" font-size="19" font-weight="400" fill="#15191e" text-anchor="start">回数・同意/拒否・質問か</text><text x="925" y="395.0" font-size="18" font-weight="400" fill="#4a535e" text-anchor="start">枠は Gemini が取り、</text><text x="925" y="421.1" font-size="18" font-weight="400" fill="#4a535e" text-anchor="start">比べるのはコード</text><line x1="1235" y1="325" x2="1295" y2="325" stroke="#6b747f" stroke-width="3" marker-end="url(#ah)"/><rect x="1300" y="200" width="540" height="250" rx="18" fill="#fff" stroke="#d5dae0" stroke-width="2"/><text x="1325" y="245" font-size="26" font-weight="700" fill="#15191e" text-anchor="start">Verification Engine</text><text x="1325" y="290.0" font-size="19" font-weight="400" fill="#4a535e" text-anchor="start">① ルール（数・時刻・日付・曜日・否定）</text><text x="1325" y="317.55" font-size="19" font-weight="400" fill="#4a535e" text-anchor="start">② 原文の枠 ↔ 訳文だけから取った枠</text><text x="1325" y="345.1" font-size="19" font-weight="400" fill="#4a535e" text-anchor="start">③ 原文と訳文の直接の照合</text><rect x="1325" y="395" width="70.44999999999999" height="31" rx="15.5" fill="#e6f1f6" stroke="#e6f1f6" stroke-width="2"/><text x="1360.225" y="415" font-size="17" font-weight="700" fill="#0b5c80" text-anchor="middle">コード</text><rect x="1430" y="395" width="118.89999999999999" height="31" rx="15.5" fill="#f1eafa" stroke="#f1eafa" stroke-width="2"/><text x="1489.45" y="415" font-size="17" font-weight="700" fill="#6b3fa0" text-anchor="middle">Gemini</text><text x="1590" y="412.0" font-size="17" font-weight="400" fill="#4a535e" text-anchor="start">強い相違は訳し直し、</text><text x="1590" y="436.65" font-size="17" font-weight="400" fill="#4a535e" text-anchor="start">残れば発言者が決める</text><line x1="640" y1="455" x2="640" y2="535" stroke="#0b5c80" stroke-width="3" marker-end="url(#ah)"/><rect x="450" y="540" width="380" height="150" rx="18" fill="#fff6db" stroke="#e9cf7a" stroke-width="2"/><text x="475" y="585" font-size="24" font-weight="700" fill="#5c4300" text-anchor="start">意図が決まらないとき</text><text x="475" y="625.0" font-size="19" font-weight="400" fill="#5c4300" text-anchor="start">訳を送らず、発言者本人に</text><text x="475" y="652.55" font-size="19" font-weight="400" fill="#5c4300" text-anchor="start">意味を選んでもらう（双方向）</text><line x1="1570" y1="455" x2="1570" y2="535" stroke="#6b747f" stroke-width="3" marker-end="url(#ah)"/><rect x="1300" y="540" width="540" height="150" rx="18" fill="#e3f3ea" stroke="#1f6b45" stroke-width="3"/><text x="1325" y="585" font-size="28" font-weight="700" fill="#1f6b45" text-anchor="start">Safety Gate</text><rect x="1500" y="562" width="70.44999999999999" height="31" rx="15.5" fill="#e6f1f6" stroke="#e6f1f6" stroke-width="2"/><text x="1535.225" y="582" font-size="17" font-weight="700" fill="#0b5c80" text-anchor="middle">コード</text><text x="1325" y="625.0" font-size="19" font-weight="400" fill="#15191e" text-anchor="start">送る直前にコードで 8 項目を確認（本人の送信・</text><text x="1325" y="652.55" font-size="19" font-weight="400" fill="#15191e" text-anchor="start">原文が同じ・意図・照合・最新の解析 など）</text><line x1="1570" y1="695" x2="1570" y2="760" stroke="#6b747f" stroke-width="3" marker-end="url(#ah)"/><rect x="80" y="770" width="410" height="120" rx="18" fill="#fff" stroke="#d5dae0" stroke-width="2"/><text x="105" y="815" font-size="26" font-weight="700" fill="#15191e" text-anchor="start">相手に届ける</text><text x="105" y="855" font-size="19" font-weight="400" fill="#4a535e" text-anchor="start">訳と照合の状態つき</text><rect x="520" y="770" width="410" height="120" rx="18" fill="#fff" stroke="#d5dae0" stroke-width="2"/><text x="545" y="815" font-size="26" font-weight="700" fill="#15191e" text-anchor="start">追加の確認質問</text><text x="545" y="855" font-size="19" font-weight="400" fill="#4a535e" text-anchor="start">医師が選び、患者が答える</text><rect x="960" y="770" width="410" height="120" rx="18" fill="#fff" stroke="#d5dae0" stroke-width="2"/><text x="985" y="815" font-size="26" font-weight="700" fill="#15191e" text-anchor="start">Teach-back</text><text x="985" y="855" font-size="19" font-weight="400" fill="#4a535e" text-anchor="start">患者の言い直しと説明を比べる</text><rect x="1400" y="770" width="410" height="120" rx="18" fill="#fff" stroke="#d5dae0" stroke-width="2"/><text x="1425" y="815" font-size="26" font-weight="700" fill="#15191e" text-anchor="start">Clinical Memory</text><text x="1425" y="855" font-size="19" font-weight="400" fill="#4a535e" text-anchor="start">原文に根拠のある問診メモ</text><rect x="80" y="915" width="1760" height="110" rx="18" fill="#f6f7f9" stroke="#f6f7f9" stroke-width="2"/><text x="105" y="958" font-size="24" font-weight="700" fill="#15191e" text-anchor="start">Conversation Auditor（届いた後に会話全体を見る）</text><rect x="700" y="935" width="118.89999999999999" height="31" rx="15.5" fill="#f1eafa" stroke="#f1eafa" stroke-width="2"/><text x="759.45" y="955" font-size="17" font-weight="700" fill="#6b3fa0" text-anchor="middle">Gemini</text><rect x="815" y="935" width="70.44999999999999" height="31" rx="15.5" fill="#e6f1f6" stroke="#e6f1f6" stroke-width="2"/><text x="850.225" y="955" font-size="17" font-weight="700" fill="#0b5c80" text-anchor="middle">コード</text><text x="105" y="997.0" font-size="19" font-weight="400" fill="#4a535e" text-anchor="start">説明と理解の相違・矛盾・未回答を、根拠の発言つきで未解決事項にする。解決にできるのは医師だけ。AI は診断しない</text></svg>