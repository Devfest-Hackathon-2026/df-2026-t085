<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><style>@import url("https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap"); text { font-family: 'Noto Sans JP','Noto Sans SC','Hiragino Sans','Yu Gothic',sans-serif; }</style><rect width="1920" height="1080" fill="#ffffff"/><text x="80" y="92" font-size="38" font-weight="700" fill="#15191e" text-anchor="start">Semantic Bridge と Verification Engine — 意味の要素を比べて、相違があれば届けない</text><text x="80" y="140" font-size="22" font-weight="400" fill="#4a535e" text-anchor="start">医師の説明「この薬は1日2回、朝と夜に1錠ずつ飲んでください。」に、誤りを1つ入れた訳を照合させた（本物の Gemini）</text><rect x="80" y="180" width="1760" height="90" rx="18" fill="#f6f7f9" stroke="#f6f7f9" stroke-width="2"/><text x="110" y="222" font-size="22" font-weight="700" fill="#0b5c80" text-anchor="start">原文の意味の枠</text><text x="330" y="222" font-size="24" font-weight="500" fill="#15191e" text-anchor="start">指示 ・ 回数 1日2回 ・ 量 1錠 ・ 時間帯 朝・夜 ・ 禁止なし</text><text x="110" y="255" font-size="17" font-weight="400" fill="#6b747f" text-anchor="start">（Gemini が取り、コードで比べる）</text><rect x="80" y="300" width="1760" height="130" rx="18" fill="#fdecea" stroke="#b42318" stroke-width="2"/><text x="110" y="350" font-size="26" font-weight="700" fill="#b42318" text-anchor="start">1日3回に変えた訳</text><text x="110" y="395" font-size="26" fill="#15191e" font-family="'Noto Sans SC',sans-serif">这个药一天吃三次，早上和晚上各吃一片。</text><text x="1180" y="350" font-size="24" font-weight="700" fill="#b42318" text-anchor="start">照合: 止める（MISMATCH）</text><text x="1180" y="392" font-size="21" font-weight="500" fill="#4a535e" text-anchor="start">見つけた相違: 数量・追加・回数</text><rect x="80" y="450" width="1760" height="130" rx="18" fill="#fdecea" stroke="#b42318" stroke-width="2"/><text x="110" y="500" font-size="26" font-weight="700" fill="#b42318" text-anchor="start">否定を足した訳</text><text x="110" y="545" font-size="26" fill="#15191e" font-family="'Noto Sans SC',sans-serif">这个药不要一天吃两次，早上和晚上各吃一片。</text><text x="1180" y="500" font-size="24" font-weight="700" fill="#b42318" text-anchor="start">照合: 止める（MISMATCH）</text><text x="1180" y="542" font-size="21" font-weight="500" fill="#4a535e" text-anchor="start">見つけた相違: 否定・禁止</text><rect x="80" y="600" width="1760" height="130" rx="18" fill="#fdecea" stroke="#b42318" stroke-width="2"/><text x="110" y="650" font-size="26" font-weight="700" fill="#b42318" text-anchor="start">夜を落とした訳</text><text x="110" y="695" font-size="26" fill="#15191e" font-family="'Noto Sans SC',sans-serif">这个药一天吃两次，早上吃一片。</text><text x="1180" y="650" font-size="24" font-weight="700" fill="#b42318" text-anchor="start">照合: 止める（MISMATCH）</text><text x="1180" y="692" font-size="21" font-weight="500" fill="#4a535e" text-anchor="start">見つけた相違: 日時・時間帯・欠落</text><rect x="80" y="750" width="1760" height="130" rx="18" fill="#e3f3ea" stroke="#1f6b45" stroke-width="2"/><text x="110" y="800" font-size="26" font-weight="700" fill="#1f6b45" text-anchor="start">正しい訳</text><text x="110" y="845" font-size="26" fill="#15191e" font-family="'Noto Sans SC',sans-serif">这个药一天吃两次，早上和晚上各吃一片。</text><text x="1180" y="800" font-size="24" font-weight="700" fill="#1f6b45" text-anchor="start">照合: 通す（VERIFIED）</text><text x="1180" y="842" font-size="21" font-weight="500" fill="#4a535e" text-anchor="start">相違なし</text><text x="80" y="935" font-size="21" font-weight="500" fill="#15191e" text-anchor="start">108 件の比較評価（同じ条件・本物の Gemini）: 誤りを入れた訳 20 件の見逃し 0 件、正しい訳を止めた 1 件。A（通常の翻訳）は照合しないので、誤りはそのまま届く</text><text x="80" y="975" font-size="18" font-weight="400" fill="#6b747f" text-anchor="start">実行: 2026-11-10 03:31 JST（各照合）・2026-11-10 04:14 JST（比較評価）、gemini-3.8-flash・global。「VERIFIED」は相違を見つけなかったという意味で、正しさの証明ではない</text></svg>