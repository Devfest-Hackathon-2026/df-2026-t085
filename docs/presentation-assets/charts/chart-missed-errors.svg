<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><style>@import url("https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap"); text { font-family: 'Noto Sans JP','Noto Sans SC','Hiragino Sans','Yu Gothic',sans-serif; }</style><rect width="1920" height="1080" fill="#ffffff"/><text x="80" y="92" font-size="38" font-weight="700" fill="#15191e" text-anchor="start">誤りを入れた訳を、そのまま届けた件数</text><text x="80" y="140" font-size="22" font-weight="400" fill="#4a535e" text-anchor="start">否定・数量・条件・回数・日時などの誤りを 1 つ入れた訳 20 件（各方式で同じ訳）</text><text x="1840" y="92" font-size="20" font-weight="700" fill="#6b747f" text-anchor="end">少ないほど安全</text><line x1="220" y1="810.0" x2="1720" y2="810.0" stroke="#d5dae0" stroke-width="1"/><text x="204" y="817.0" font-size="18" font-weight="400" fill="#6b747f" text-anchor="end">0</text><line x1="220" y1="670.0" x2="1720" y2="670.0" stroke="#d5dae0" stroke-width="1"/><text x="204" y="677.0" font-size="18" font-weight="400" fill="#6b747f" text-anchor="end">5</text><line x1="220" y1="530.0" x2="1720" y2="530.0" stroke="#d5dae0" stroke-width="1"/><text x="204" y="537.0" font-size="18" font-weight="400" fill="#6b747f" text-anchor="end">10</text><line x1="220" y1="390.0" x2="1720" y2="390.0" stroke="#d5dae0" stroke-width="1"/><text x="204" y="397.0" font-size="18" font-weight="400" fill="#6b747f" text-anchor="end">15</text><line x1="220" y1="250.0" x2="1720" y2="250.0" stroke="#d5dae0" stroke-width="1"/><text x="204" y="257.0" font-size="18" font-weight="400" fill="#6b747f" text-anchor="end">20</text><path d="M297.5,810 V254.0 q0,-4 4,-4 H513.5 q4,0 4,4 V810 Z" fill="#0b5c80"/><text x="407.5" y="236.0" font-size="28" font-weight="700" fill="#15191e" text-anchor="middle">20 / 20</text><text x="407.5" y="854" font-size="22" font-weight="700" fill="#15191e" text-anchor="middle">A  通常の翻訳</text><path d="M672.5,810 V254.0 q0,-4 4,-4 H888.5 q4,0 4,4 V810 Z" fill="#0b5c80"/><text x="782.5" y="236.0" font-size="28" font-weight="700" fill="#15191e" text-anchor="middle">20 / 20</text><text x="782.5" y="854" font-size="22" font-weight="700" fill="#15191e" text-anchor="middle">B  ＋意図の解析</text><text x="1157.5" y="796.0" font-size="28" font-weight="700" fill="#15191e" text-anchor="middle">0 / 20</text><text x="1157.5" y="854" font-size="22" font-weight="700" fill="#15191e" text-anchor="middle">C  ＋意味の照合</text><text x="1532.5" y="796.0" font-size="28" font-weight="700" fill="#15191e" text-anchor="middle">0 / 20</text><text x="1532.5" y="854" font-size="22" font-weight="700" fill="#15191e" text-anchor="middle">D  UNSAID 完全版</text><line x1="220" y1="810" x2="1720" y2="810" stroke="#4a535e" stroke-width="2"/><text x="80" y="920.0" font-size="19" font-weight="400" fill="#6b747f" text-anchor="start">A・B は訳を照合しないので、誤りはすべてそのまま届く（仕組みの上で 100%）。</text><text x="80" y="947.55" font-size="19" font-weight="400" fill="#6b747f" text-anchor="start">本物の Gemini（gemini-3.8-flash・global、評価用のプロジェクト）・2026-11-10 04:14 JST・架空の症例・正解は開発チームが事前に決めた</text></svg>