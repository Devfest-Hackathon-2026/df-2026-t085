<body>
<!-- 患者のスマホ（UI 案B v2）。医師 PC の QR から ?s=<session id> で開く。
     1画面に1つのことだけ: 言語 → 同意 → 話す（文字を確かめて「送信」）→ 意味と訳の確認（必要なときだけ）→ 医師に届く。
     状態はすべて watchMessages から決める。送信は1回だけで、意図の解析・訳の照合（Safety Gate）を通ったものが届く。
     医師が確認質問・理解の確認を送ると、話す画面の医師の吹き出しに出る（選択肢で答えるか、いつもどおり話して答える） -->
<main id="app"></main>
<script type="module">
import * as unsaid from "./unsaid.js";
import { h, icon, MIC_SVG, STOP_SVG, highlight, toast, micController, buildMemo, isConfirmed, ATTRS, stuckWatch } from "./ui.js";
import { speakState } from "./patient-view.js";

      "Ứng dụng này dùng AI (Google Gemini) để dịch giữa bạn và bác sĩ.",

const app = document.getElementById("app");
const sid = new URLSearchParams(location.search).get("s");
const S = {
  lang: null, msgs: [], draft: "", mic: "idle", busy: null, freeText: false, ended: false, online: true,
  dismissed: new Set(load("dismissed") ?? []),
  pendingLang: null, // 言語を選んだ後、同意する前
  reopen: null,      // 「回答を直す」で開き直した確認質問の id
};
let t = T.en;
let mic;
let watch; // 待ちのまま止まった発言を見つける（ui.js）
let lastKey = "";

function load(k) { try { return JSON.parse(sessionStorage.getItem(`unsaid:${sid}:${k}`)); } catch { return null; } }
function save(k, v) { try { sessionStorage.setItem(`unsaid:${sid}:${k}`, JSON.stringify(v)); } catch {} }

// 患者にはその人の言語の決まった文だけを出す（サーバーの文言は日本語なので出さない。詳しくは console）
const fail = (e) => {
  console.error(e);
  S.busy = null;
  toast(e?.code === "permission-denied" ? t.expired
    : ["NotAllowedError", "SecurityError", "NotFoundError"].includes(e?.name) ? t.micDenied : t.error);
  render(true);
};

function setLang(lang) {
  S.lang = lang;
  t = T[lang] ?? T.en;
  document.documentElement.lang = lang;
}

// ── どの画面を出すか ──
// 今の発言 = 自分の最新の発言のうち、まだ送っていない・「違う」と戻していないもの
function view() {
  if (!sid) return { name: "nosession" };
  if (S.ended) return { name: "ended" };
  if (!S.lang) return { name: S.pendingLang ? "consent" : "join" };
  const mine = S.msgs.filter((m) => m.from === "patient");
  const last = mine.at(-1);
  const active = last && !["sent", "received", "cancelled"].includes(last.status) && !S.dismissed.has(last.id) ? last : null;
  if (active) {
    const c = active.clarification;
    if (active.status === "error" || watch?.isStuck(active)) return { name: "error", m: active };
    if (active.status === "analyzing") {
      return { name: "wait", m: active, text: active.gate?.state === "VERIFYING" ? t.verifying : t.checking, step: 1 };
    }
    // 自分の発言の意味が文脈で決まらない → 本人に聞く。訳の照合で相違が残った → 本人が決める（自動では送らない）
    if (active.status === "awaiting_intent" && S.busy !== active.id) return { name: "intent", m: active };
    if (active.status === "needs_review" && S.busy !== active.id) return { name: "review", m: active };
    if (["awaiting_intent", "needs_review"].includes(active.status)) return { name: "wait", m: active, text: t.translating, step: 2 };
    if (active.status === "clarifying" && !c?.answer && S.busy !== active.id) return { name: "clarify", m: active };
    if (active.status === "clarifying") return { name: "wait", m: active, text: t.translating, step: 2 };
    if (active.status === "confirmed") return { name: "confirm", m: active };
  }
  // どの医師の発言を出し、どの質問に答えるか（質問ごとに、答えが届いたかで判定する。web/patient-view.js）
  return { name: "speak", ...speakState(S.msgs, S.reopen) };
}

function keyOf(v) {
  return JSON.stringify([canSpeak, memoItems().length, v.name, v.m?.id, v.m?.status, v.doctors?.map((d) => d.id).join(), v.lastSent?.id, v.lastSent?.status, S.mic, S.busy, S.freeText, S.lang, S.pendingLang, v.openQ?.id, [...(v.openIds ?? [])].join(), S.reopen, S.online]);
}

function render(force = false) {
  const v = view();
  const key = keyOf(v);
  if (!force && key === lastKey) return;
  lastKey = key;
  app.replaceChildren(screens[v.name](v));
  app.querySelector("[autofocus]")?.focus();
}

const steps = (n) => h("div", { class: "p-steps", "aria-hidden": "true" },
  [1, 2, 3].map((i) => h("span", { class: i <= n ? "on" : "" })));
const dot = () => h("span", { class: "dot" + (S.online ? "" : " off"), title: S.online ? "connected" : "offline" });
const top = (n) => h("div", { class: "p-top" }, n ? steps(n) : h("span"), dot());

const screens = {
  ended: () => h("section", { class: "p-screen" }, h("div", { class: "p-center" }, h("p", {}, t.ended))),

  nosession: () => h("section", { class: "p-screen" }, h("div", { class: "p-center" }, h("p", {}, T.en.noSession))),

  join: () => h("section", { class: "p-screen" },
    top(0),
    h("div", { class: "p-body" },
      h("div", { class: "p-question", lang: "mul" }, "Language · 语言 · Ngôn ngữ"),
      h("div", { class: "p-langs" }, unsaid.PATIENT_LANGS.map((l) =>
        h("button", { class: "p-option", lang: l, disabled: S.busy === "join",
          onclick: () => { S.pendingLang = l; render(true); } }, T[l]?.name ?? l))))),

  // 使う前に、何に AI を使うか・記録がどうなるかを本人の言語で伝える（同意したら参加）
  consent: () => {
    const tt = T[S.pendingLang] ?? T.en;
    return h("section", { class: "p-screen", lang: S.pendingLang },
      top(0),
      h("div", { class: "p-body" },
        h("h1", { class: "p-consent-title" }, tt.consentTitle),
        h("ul", { class: "p-consent" }, tt.consent.map((x) => h("li", {}, x)))),
      h("div", { class: "p-spacer" }),
      h("div", { class: "p-actions" },
        h("button", { class: "btn-primary", disabled: S.busy === "join", onclick: () => join(S.pendingLang) }, tt.agree),
        h("button", { class: "btn-link", onclick: () => { S.pendingLang = null; render(true); } }, tt.back)));
  },

  speak: (v) => {
    const ph = v.openQ ? t.answerPlaceholder : t.placeholder;
    const ta = h("textarea", { id: "draft", rows: 2, placeholder: ph, "aria-label": ph,
      oninput: (e) => { S.draft = e.target.value; nextBtn.disabled = !S.draft.trim(); } });
    ta.value = S.draft;
    // 送信は1回だけ（音声の文字は入力欄に入るだけで、送るのはこのボタン）
    const nextBtn = h("button", { onclick: say, disabled: !S.draft.trim() || S.busy === "say" }, t.send);
    const clearBtn = S.draft && h("button", { class: "p-clear", "aria-label": t.clear, title: t.clear,
      onclick: () => { S.draft = ""; render(true); } }, icon("x"));
    const rec = S.mic === "recording";
    const n = memoItems().length;
    return h("section", { class: "p-screen" },
      h("div", { class: "p-top" },
        n ? h("button", { class: "p-memo-btn", onclick: openMemo }, `${t.memo} (${n})`) : h("span"),
        dot()),
      h("div", { class: "p-body" },
        v.doctors.map((d, i) => doctorCard(d, i < v.doctors.length - 1 && !v.openIds.has(d.id), v.openIds.has(d.id))),
        v.lastSent && h("div", { class: "p-status" },
          icon(v.lastSent.status === "received" ? "check-check" : "check"), v.lastSent.status === "received" ? t.read : t.sent),
        // 送った後に、医師に届いた内容を自分の言語で見られる（承認はもう求めない）。違っていたら言い直す
        v.lastSent?.translation?.back_translation && !v.lastSent.replyTo && h("div", { class: "p-sent-read" },
          `${t.doctorRead}: “${v.lastSent.translation.back_translation}”`,
          h("button", { class: "btn-link", onclick: () => { S.draft = v.lastSent.original; render(true); } }, t.sayAgain)),
        v.answeredQ && h("div", { class: "p-answered" }, `${t.yourAnswer}: ${v.lastSent.original}`,
          h("button", { class: "btn-link", onclick: () => { S.reopen = v.answeredQ.id; render(true); } }, t.change)),
        // 理解の確認（teach-back）への答えなど: 何を送ったかを自分で見られる（「医生已读」だけにしない）
        v.lastSent?.replyTo && !v.answeredQ && h("div", { class: "p-answered" }, `${t.yourAnswer}: ${v.lastSent.original}`)),
      h("div", { class: "p-spacer" }),
      h("div", { class: "p-speak" },
        h("button", { class: "mic" + (rec ? " recording" : ""), "aria-label": rec ? t.micStop : t.mic,
          disabled: S.mic === "transcribing", onclick: () => mic.toggle(), html: rec ? STOP_SVG : MIC_SVG }),
        h("div", { class: "hint", "aria-live": "polite" }, rec ? t.listening : S.mic === "transcribing" ? t.converting
          : v.openQ?.kind === "teachback" ? t.tbHint : v.openQ ? t.answerHint : t.hint),
        h("div", { class: "p-input" }, ta, clearBtn, nextBtn)));
  },

  // Translation Intent Clarification: 自分の発言の意味を選ぶ・自分の言葉で説明する・言い直す
  intent: ({ m }) => {
    const it = m.gate.intent;
    const own = S.freeText || !it.interpretations?.length;
    const body = own
      ? (() => {
          const ta = h("textarea", { rows: 3, "aria-label": t.intentOwnPlaceholder, placeholder: t.intentOwnPlaceholder,
            autofocus: true, oninput: (e) => (okBtn.disabled = !e.target.value.trim()) });
          const okBtn = h("button", { class: "btn-primary", disabled: true,
            onclick: () => chooseIntent(m, "free_text", ta.value.trim()) }, t.send);
          return h("div", { class: "p-free" }, ta, okBtn,
            it.interpretations?.length > 0 && h("button", { class: "btn-link btn-icon",
              onclick: () => { S.freeText = false; render(true); } }, icon("arrow-left"), t.back));
        })()
      : h("div", { class: "p-options" }, it.interpretations.map((i) =>
          h("button", { class: "p-option", onclick: () => chooseIntent(m, i.id) }, i.meaning_speaker)));
    return h("section", { class: "p-screen" },
      top(2),
      h("div", { class: "p-body" },
        h("div", { class: "p-said" }, m.original),
        h("h1", { class: "p-question" }, it.question_speaker || t.intentQ),
        body),
      h("div", { class: "p-spacer" }),
      h("div", { class: "p-links" },
        !own && h("button", { class: "btn-link", onclick: () => { S.freeText = true; render(true); } }, t.intentOwn),
        h("button", { class: "btn-link", onclick: () => chooseIntent(m, "none") }, t.intentNone)));
  },

  // 訳の照合で相違が残ったとき（訳し直しても）。言い直すか、「未検証」と分かる形で送るかを本人が決める
  review: ({ m }) => {
    const g = m.gate;
    const notes = (g.verification?.issues ?? []).map((i) => i.detail_speaker).filter(Boolean).slice(0, 3);
    return h("section", { class: "p-screen" },
      top(3),
      h("div", { class: "p-body" },
        h("div", { class: "p-said" }, m.original),
        h("h1", { class: "p-question" }, t.reviewTitle),
        notes.length > 0 && h("ul", { class: "p-review-issues" }, notes.map((n) => h("li", {}, n))),
        g.draft?.back_translation && [h("div", { class: "p-label" }, t.reviewDoctorReads),
          h("div", { class: "p-big" }, `“${g.draft.back_translation}”`)]),
      h("div", { class: "p-spacer" }),
      h("div", { class: "p-actions" },
        h("button", { class: "btn-primary", disabled: S.busy === m.id, onclick: () => reviewAct(m, "rephrase") }, t.rephrase),
        h("button", { class: "btn-link", disabled: S.busy === m.id, onclick: () => reviewAct(m, "send_unverified") }, t.sendAnyway)));
  },

  wait: (v) => h("section", { class: "p-screen" },
    top(v.step),
    h("div", { class: "p-body" }, h("div", { class: "p-said" }, highlight(v.m.original, v.m.clarification?.target))),
    h("div", { class: "p-center", "aria-live": "polite" }, h("div", { class: "spinner" }), h("p", {}, v.text))),

  clarify: ({ m }) => {
    const c = m.clarification;
    const fx = c.fixed_options ?? {};
    const body = S.freeText
      ? (() => {
          const ta = h("textarea", { rows: 3, "aria-label": t.writeHere, placeholder: t.writeHere, autofocus: true,
            oninput: (e) => (okBtn.disabled = !e.target.value.trim()) });
          const okBtn = h("button", { class: "btn-primary", disabled: true,
            onclick: () => answer(m, "free_text", ta.value.trim()) }, t.ok);
          return h("div", { class: "p-free" }, ta, okBtn,
            h("button", { class: "btn-link btn-icon", onclick: () => { S.freeText = false; render(true); } }, icon("arrow-left"), t.back));
        })()
      : h("div", { class: "p-options" }, (c.options ?? []).map((o) =>
          h("button", { class: "p-option", onclick: () => answer(m, "option", o) }, o)));
    return h("section", { class: "p-screen" },
      top(2),
      h("div", { class: "p-body" },
        h("div", { class: "p-said" }, highlight(m.original, c.target)),
        h("h1", { class: "p-question" }, c.question),
        body),
      h("div", { class: "p-spacer" }),
      !S.freeText && h("div", { class: "p-links" },
        h("button", { class: "btn-link", onclick: () => answer(m, "unsure") }, fx.unsure ?? "?"),
        h("button", { class: "btn-link", onclick: () => { S.freeText = true; render(true); } }, fx.free_text ?? "…")));
  },

  confirm: ({ m }) => h("section", { class: "p-screen" },
    top(3),
    h("div", { class: "p-body" },
      h("div", { class: "p-label" }, t.doctorReads),
      h("div", { class: "p-big" }, `“${m.translation?.back_translation ?? ""}”`)),
    h("div", { class: "p-spacer" }),
    h("div", { class: "p-actions" },
      h("button", { class: "btn-primary", disabled: S.busy === m.id, onclick: () => send(m) }, t.send),
      h("button", { class: "btn-link", onclick: () => notRight(m) }, t.notRight))),

  error: ({ m }) => h("section", { class: "p-screen" },
    top(0),
    h("div", { class: "p-body" }, h("div", { class: "p-said" }, m.original)),
    h("div", { class: "p-center" }, h("p", {}, t.error)),
    h("div", { class: "p-actions" },
      h("button", { class: "btn-primary", disabled: S.busy === m.id, onclick: () => retry(m) }, t.retry),
      h("button", { class: "btn-link", onclick: () => notRight(m) }, t.notRight))),
};

// 医師の吹き出し。確認質問なら選択肢と「分からない」「どれでもない」、理解の確認なら元の説明も出す
function doctorCard(d, old, open) {
  const listen = canSpeak && h("button", { class: "btn-link p-listen", "aria-label": t.listen,
    onclick: () => speak(d.translation?.text) }, icon("volume-2"), t.listen);
  const who = d.kind === "clarify" ? h("span", { class: "tag-q" }, t.question)
    : d.kind === "teachback" ? h("span", { class: "tag-q" }, t.tbTitle) : t.doctor;
  const exp = d.kind === "teachback" && S.msgs.find((m) => m.id === d.teachback.explanation_id);
  const c = d.kind === "clarify" ? d.clarify : null;
  const busy = S.busy === `q:${d.id}`;
  return h("div", { class: "p-doctor" + (old ? " old" : "") },
    h("div", { class: "who" }, who, listen),
    exp && h("div", { class: "p-explain" }, exp.translation?.text ?? ""),
    h("div", { class: "say" }, d.translation?.text ?? ""),
    d.gate?.override === "speaker_ack" && h("div", { class: "p-unverified" }, t.unverifiedFromDoctor),
    open && c && c.options?.length > 0 && h("div", { class: "p-options" }, c.options.map((o, i) =>
      h("button", { class: "p-option", disabled: busy, onclick: () => answerQ(d, "option", o, i) }, o))),
    open && c && h("div", { class: "p-links" },
      h("button", { class: "btn-link", disabled: busy, onclick: () => answerQ(d, "unsure", c.fixed?.unsure) }, c.fixed?.unsure ?? "?"),
      c.options?.length > 0 && h("button", { class: "btn-link", disabled: busy,
        onclick: () => answerQ(d, "none", c.fixed?.none) }, c.fixed?.none ?? "—")));
}

// ── 自分のメモ（医師に届いた内容を、自分の言語・自分の言い方で見返す）──
// 医師画面の問診メモと同じ facts から作る。確かめた語は自分の答えに置き換える。診断の言葉は足さない
const KINDS = ["symptom", "onset", "frequency", "severity", "medication", "allergy", "other"];
const norm = (x) => x.toLowerCase().replace(/[\s.,!?。、，！？]/g, "");
const memoData = () => buildMemo(S.msgs, (f, m) => {
  const confirmed = isConfirmed(f, m) && Boolean(m.clarification.answer.text);
  return { text: confirmed ? m.clarification.answer.text : f.text, confirmed, negated: f.negated };
}, norm);
const memoItems = () => ({ length: memoData().count });

const sheet = h("dialog", { class: "p-sheet", onclick: (e) => { if (e.target === sheet) sheet.close(); } });
document.body.append(sheet);
function paintMemo() {
  const { symptoms, others, count } = memoData();
  const line = (it) => [it.negated && h("span", { class: "neg" }, icon("x")), it.text, it.confirmed && h("span", { class: "check" }, icon("check"))];
  const groups = [];
  if (symptoms.length) groups.push(h("div", { class: "p-memo-group" }, h("div", { class: "k" }, t.kinds.symptom),
    symptoms.map((sy) => h("div", { class: "sym" }, h("div", { class: "v" }, line(sy)),
      ATTRS.filter((a) => sy.attrs[a]).map((a) => h("div", { class: "attr" }, h("span", { class: "ak" }, t.kinds[a]), line(sy.attrs[a])))))));
  for (const k of KINDS) if (others.has(k)) {
    groups.push(h("div", { class: "p-memo-group" }, h("div", { class: "k" }, t.kinds[k]), others.get(k).map((it) => h("div", { class: "v" }, line(it)))));
  }
  sheet.replaceChildren(h("div", { class: "p-sheet-in" },
    h("div", { class: "p-sheet-head" },
      h("h2", {}, t.memo),
      h("button", { class: "btn-link", onclick: () => sheet.close() }, t.close)),
    h("p", { class: "p-sheet-sub" }, t.memoSub),
    count ? groups : h("p", { class: "p-sheet-sub" }, t.memoEmpty)));
}
function openMemo() { paintMemo(); sheet.showModal(); }

// ── 医師の言葉を読み上げる（体調が悪い・文字を読むのがつらい人のため）──
// 端末の音声合成（Web Speech API）を使う。サーバーにも外部にも送らない。端末に患者の言語の声が無ければボタンを出さない
const VOICE_LANG = { en: "en-US", "zh-CN": "zh-CN", vi: "vi-VN" };
let canSpeak = false;
function checkVoices() {
  const want = (VOICE_LANG[S.lang] ?? "en-US").toLowerCase();
  const prefix = want.split("-")[0];
  const ok = speechSynthesis.getVoices().some((v) => v.lang.toLowerCase().replace("_", "-").startsWith(prefix));
  if (ok !== canSpeak) { canSpeak = ok; render(true); }
}
function speak(text) {
  if (!text) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = VOICE_LANG[S.lang] ?? "en-US";
  u.rate = 0.9;
  speechSynthesis.speak(u);
}

// ── 操作 ──
async function join(lang) {
  S.busy = "join"; render(true);
  try {
    await unsaid.joinSession(sid, lang);
    S.busy = null;
    await start(lang);
  } catch (e) { fail(e); }
}

async function say() {
  const text = S.draft.trim();
  if (!text || S.busy === "say") return;
  const q = view().openQ; // 医師の質問が開いていれば、話した言葉はその答え
  S.busy = "say"; S.reopen = null; render(true);
  try {
    // 吹き出しは addDoc の時点で onSnapshot に出る。翻訳も onSnapshot の方が先に届く
    const created = () => { if (S.busy === "say") { S.busy = null; render(true); } }; // 発言ができたら次の操作をできるようにする
    const p = q ? unsaid.reply(sid, q.id, text, "free_text", undefined, created) : unsaid.say(sid, "patient", text, null, created);
    S.draft = "";
    await p;
  } catch (e) {
    // 発言はできたが API に届かなかった: その発言に「もう一度」を出す。発言自体が無ければ文字を入力欄に戻す
    if (e.messageId) watch.fail(e.messageId); else S.draft = text;
    fail(e);
    return;
  }
  if (S.busy === "say") S.busy = null;
  render();
}

// 医師の確認質問に選択肢・「分からない」・「どれでもない」で答える（訳はもうあるので、そのまま医師に届く）
async function answerQ(q, type, text, index) {
  if (S.busy) return;
  S.busy = `q:${q.id}`; S.reopen = null; render(true);
  const created = () => { if (S.busy === `q:${q.id}`) { S.busy = null; render(true); } };
  try { await unsaid.reply(sid, q.id, text ?? "", type, index, created); } catch (e) {
    if (e.messageId) watch.fail(e.messageId);
    fail(e);
    return;
  }
  S.busy = null; render();
}

// 自分の発言の意味を選んだ（"i1" など）・説明した（"free_text"）・どれでもない（"none" → 入力欄に戻して言い直す）
async function chooseIntent(m, choice, text = "") {
  S.busy = m.id; S.freeText = false; render(true);
  try {
    const r = await unsaid.chooseIntent(sid, m.id, choice, text);
    if (choice === "none") S.draft = r?.original ?? m.original;
  } catch (e) { fail(e); return; }
  S.busy = null; render(true);
}

async function reviewAct(m, action) {
  S.busy = m.id; render(true);
  try {
    const r = await unsaid.reviewMessage(sid, m.id, action);
    if (action === "rephrase") S.draft = r?.original ?? m.original;
  } catch (e) { fail(e); return; }
  S.busy = null; render(true);
}

async function answer(m, type, text = "") {
  S.busy = m.id; S.freeText = false; render(true); // 押したらすぐ「翻訳しています…」
  try { await unsaid.answer(sid, m.id, type, text); } catch (e) {
    if (e.messageId) watch.fail(e.messageId);
    fail(e);
    return;
  }
  S.busy = null; render();
}

async function send(m) {
  S.busy = m.id; render(true);
  try { await unsaid.send(sid, m.id); } catch (e) { fail(e); return; }
  S.busy = null; render();
}

async function retry(m) {
  watch.reset(m);
  S.busy = m.id; render(true);
  try { await unsaid.retry(sid, m); } catch (e) { fail(e); return; }
  S.busy = null; render();
}

// 「違う」: この発言は送らずに、話す画面へ戻す（文字は入力欄に戻して直せるようにする）
function notRight(m) {
  if (m.gate) unsaid.cancelMessage(sid, m.id).catch(() => {}); // サーバーでも取り消す（後から解析が終わっても送らない）
  S.dismissed.add(m.id);
  save("dismissed", [...S.dismissed]);
  S.draft = m.original;
  render(true);
}

async function start(lang) {
  setLang(lang);
  S.pendingLang = null;
  unsaid.watchConnection((on) => { S.online = on; render(); });
  watch = stuckWatch(() => render());
  mic = micController({
    Recorder: unsaid.Recorder,
    transcribe: (wav) => unsaid.transcribe(sid, "patient", wav),
    onText: (text) => {
      if (!text) { toast(t.heardNothing); return; }
      S.draft = S.draft ? `${S.draft} ${text}` : text;
      render(true);
    },
    onChange: (s) => { S.mic = s; render(); },
    onError: fail,
  });
  if ("speechSynthesis" in window) {
    checkVoices();
    speechSynthesis.addEventListener?.("voiceschanged", checkVoices);
  }
  // 医師が「診察を終える」と session と発言が消え、読めなくなる（permission-denied）→ 終了の画面
  const ended = (e) => {
    if (e?.code !== "permission-denied") return fail(e);
    S.ended = true;
    mic?.close();
    if (sheet.open) sheet.close();
    render(true);
  };
  unsaid.watchSession(sid, (s) => { if (!s) ended({ code: "permission-denied" }); }, ended);
  unsaid.watchMessages(sid, (msgs) => { S.msgs = msgs; render(); if (sheet.open) paintMemo(); }, ended);
  render(true);
}

(async () => {
  if (!sid) return render(true);
  await unsaid.login();
  const s = await unsaid.mySession(sid); // 再読み込み: 参加済みならそのまま
  if (s?.patientLang) await start(s.patientLang);
  else render(true);
})().catch(fail);
</script>
